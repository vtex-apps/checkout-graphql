# =======================================================================
# SonarQube configuration for the checkout-graphql VTEX IO app.
#
# The SONAR_HOST_URL and SONAR_TOKEN are provided as repository secrets in
# the GitHub Actions workflow (.github/workflows/ci.yml).
# =======================================================================

sonar.projectKey=vtex-checkout-graphql
sonar.projectName=checkout-graphql

# --- Sources ----------------------------------------------------------------
# Only the `node/` service contains analyzable source code.
sonar.sources=node

# Exclude generated, vendored and non-production files from analysis.
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/__tests__/**,\
  **/__fixtures__/**,\
  **/typings/**,\
  **/*.d.ts

# --- Tests ------------------------------------------------------------------
sonar.tests=node/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# --- Coverage ---------------------------------------------------------------
# Jest (via vtex-test-tools) writes lcov.info to node/coverage/ by default
# when the `--coverage` flag is used.
sonar.javascript.lcov.reportPaths=node/coverage/lcov.info
sonar.typescript.lcov.reportPaths=node/coverage/lcov.info

# --- Misc -------------------------------------------------------------------
sonar.sourceEncoding=UTF-8
